<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Box Racing" />
    <meta name="twitter:description" content="A multiplayer 3D racing game" />
    <meta name="twitter:image" content="./assets/img/demo.png" />
    <!-- Open Graph Metadata (for Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Box Racing" />
    <meta property="og:description" content="A multiplayer 3D racing game" />
    <meta property="og:image" content="./assets/img/demo.png" />
    <meta property="og:type" content="website" />
    <!-- Emoji Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚘</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@700&family=JetBrains+Mono:ital,wght@0,700;1,700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Box Racing</title>
    <script src="lib/enable3d.framework.0.25.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  </head>

  <body>
    <div id="car-selection">
      <div id="car-selection-panel">
        <div id="car-selection-body">
          <div id="car-selection-stage">
            <div id="car-selection-preview-slot">
              <div id="car-selection-preview"></div>
            </div>
            <h1>Choose Car</h1>
            <div id="car-selection-options"></div>
          </div>
          <div id="car-selection-controls">
            <label id="player-name-field">
              <span class="player-name-label">Player name</span>
              <span id="player-name-box">
                <span id="player-name-visual" aria-hidden="true">
                  <span id="player-name-before"></span><span id="player-name-caret"></span><span id="player-name-after"></span>
                </span>
                <input id="player-name-input" type="text" maxlength="12" autocomplete="nickname" spellcheck="false" />
              </span>
            </label>
            <div id="car-selection-settings">
              <div class="car-selection-setting">
                <span>Bots</span>
                <div class="car-selection-stepper" data-param="numBots" data-min="0" data-max="20">
                  <button type="button" data-step="-1">-</button>
                  <span class="car-selection-stepper-value"></span>
                  <button type="button" data-step="1">+</button>
                </div>
              </div>
              <div class="car-selection-setting">
                <span>Laps</span>
                <div class="car-selection-stepper" data-param="numLaps" data-min="1" data-max="20">
                  <button type="button" data-step="-1">-</button>
                  <span class="car-selection-stepper-value"></span>
                  <button type="button" data-step="1">+</button>
                </div>
              </div>
              <div id="car-selection-toggles">
                <label class="h-toggle">
                  <input data-hud-toggle="sound" type="checkbox" />
                  <span class="h-toggle-label">Sound</span>
                  <span class="h-toggle-track"><span class="h-toggle-thumb"></span></span>
                </label>
                <label class="h-toggle">
                  <input data-hud-toggle="tc" type="checkbox" />
                  <span class="h-toggle-label">Driver Aids</span>
                  <span class="h-toggle-track"><span class="h-toggle-thumb"></span></span>
                </label>
                <label class="h-toggle">
                  <input data-hud-toggle="auto-steer" type="checkbox" />
                  <span class="h-toggle-label">Auto Drive</span>
                  <span class="h-toggle-track"><span class="h-toggle-thumb"></span></span>
                </label>
                <label class="h-toggle" id="car-selection-tilt">
                  <input data-hud-toggle="tilt" type="checkbox" />
                  <span class="h-toggle-label">Tilt Steer</span>
                  <span class="h-toggle-track"><span class="h-toggle-thumb"></span></span>
                </label>
                <label class="h-toggle" id="car-selection-auto-throttle">
                  <input data-hud-toggle="auto-throttle" type="checkbox" />
                  <span class="h-toggle-label">Auto Throttle</span>
                  <span class="h-toggle-track"><span class="h-toggle-thumb"></span></span>
                </label>
                <label class="h-toggle">
                  <input id="car-selection-skip-intro" type="checkbox" />
                  <span class="h-toggle-label">Skip Intro</span>
                  <span class="h-toggle-track"><span class="h-toggle-thumb"></span></span>
                </label>
              </div>
            </div>
            <button id="car-selection-start" type="button">Race</button>
          </div>
        </div>
      </div>
    </div>
    <!-- <div id="info-text">Car using Raycast Vehicle<br />WASD and SPACE</div> -->
    <div id="top-left-controls">
      <div id="game-menu">
        <button type="button" id="game-menu-btn">Menu</button>
        <div id="game-menu-items" hidden>
          <button type="button" id="game-menu-home">Home</button>
          <button type="button" id="create-server-btn">Create Server</button>
          <button type="button" id="game-menu-offline">Offline Mode</button>
          <button type="button" id="game-menu-replay">Replay</button>
          <button type="button" id="game-menu-options">Options</button>
        </div>
      </div>
      <div id="camera-switcher">
        <button type="button" id="camera-switcher-btn" aria-label="Camera" aria-haspopup="listbox" aria-expanded="false">🎥</button>
        <div id="camera-switcher-menu" hidden></div>
      </div>
    </div>
    <div id="hud-bottom-left">
      <div id="fps-counter">-- fps</div>
      <div id="physics-timer">0.0</div>
      <div id="accelerometer">
        <div id="accelerometer-face">
          <div id="accel-half-g"></div>
          <div id="accel-dot"></div>
        </div>
      </div>
      <div id="tach-cluster">
        <div id="tachometer" class="tachometer" aria-label="Tachometer"></div>
        <div id="input-hud" aria-label="Inputs">
          <div id="input-steer">
            <img class="steering-wheel" src="svg/steering-wheel.svg" alt="" aria-hidden="true">
          </div>
          <div class="input-pedal throttle"><span></span></div>
          <div class="input-pedal brake"><span></span></div>
        </div>
      </div>
    </div>
    <div id="hud-bottom-right">
      <div id="hud-toast" class="hud-toast"></div>
      <div id="hud-toggles">
        <label id="sound-toggle" class="v-toggle sound-toggle" data-help="Sound">
          <input id="sound-toggle-input" data-hud-toggle="sound" type="checkbox" />
          <span class="v-toggle-label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </span>
          <span class="v-toggle-track"><span class="v-toggle-thumb"></span></span>
        </label>
        <label id="tc-toggle" class="v-toggle" data-help="Driver Aids">
          <input id="tc-toggle-input" data-hud-toggle="tc" type="checkbox" />
          <span class="v-toggle-label">TC</span>
          <span class="v-toggle-track"><span class="v-toggle-thumb"></span></span>
        </label>
        <label id="auto-steer-toggle" class="v-toggle auto-steer-toggle" data-help="Auto Drive">
          <input id="auto-steer-toggle-input" data-hud-toggle="auto-steer" type="checkbox" />
          <span class="v-toggle-label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <mask id="as-wheel-cut">
                <circle cx="12" cy="12" r="11" fill="#fff"/>
                <circle cx="12" cy="12" r="7.4" fill="#000"/>
                <rect x="3.2" y="10.4" width="17.6" height="3.2" rx="0.6" fill="#fff"/>
                <rect x="10.4" y="12" width="3.2" height="8.8" rx="0.6" fill="#fff"/>
                <circle cx="12" cy="12" r="4.1" fill="#fff"/>
                <circle cx="12" cy="12" r="1.7" fill="#000"/>
                <circle cx="6.1" cy="12" r="1" fill="#000"/>
                <circle cx="17.9" cy="12" r="1" fill="#000"/>
                <circle cx="12" cy="17.9" r="1" fill="#000"/>
              </mask>
              <rect width="24" height="24" fill="currentColor" mask="url(#as-wheel-cut)"/>
            </svg>
          </span>
          <span class="v-toggle-track"><span class="v-toggle-thumb"></span></span>
        </label>
      </div>
      <div id="hp-bar"><div id="hp-fill"></div></div>
    </div>
    <div id="race-hud" aria-expanded="false">
      <div id="race-hud-summary">P-  -/-  0:00.0</div>
      <div id="race-hud-expanded">
        <div id="race-hud-position">P-</div>
        <div id="race-hud-player-name"></div>
        <div class="race-hud-row">
          <span class="race-hud-label">LAP</span>
          <span id="lap-counter">-/-</span>
        </div>
        <div class="race-hud-row race-hud-time">
          <span class="lap-time-whole">
            <span class="race-hud-label">TIME</span>
            <span id="lap-time-whole">0:00</span>
          </span>
          <span class="lap-time-dot">.</span>
          <span id="lap-time-frac" class="lap-time-frac">0</span>
        </div>
        <div id="race-hud-standings">
          <div class="race-hud-racer race-hud-standings-head">
            <span>P</span>
            <span>NAME</span>
            <span class="race-hud-stat">LAP</span>
            <span class="race-hud-stat">LAST</span>
            <span class="race-hud-stat">INT</span>
            <span>GAP</span>
          </div>
        </div>
      </div>
    </div>
    <div id="offscreen-markers"></div>
    <div id="race-countdown"></div>
    <div id="race-finish" aria-live="polite">
      <div id="race-finish-title"></div>
      <div id="race-finish-standings"></div>
      <div id="race-finish-next"></div>
    </div>
    <div id="replay-overlay">
      <div id="replay-badge">REPLAY</div>
      <div id="replay-bar">
        <div id="replay-timeline-row">
          <button type="button" id="replay-play" title="Play / Pause (Space)">Pause</button>
          <span id="replay-time" title="Current time / Total duration">0:00.0 / 0:00.0</span>
          <div id="replay-timeline-wrap">
            <div id="replay-cut-track" aria-label="Camera cuts timeline"></div>
            <div id="replay-scrubber">
              <input id="replay-timeline" type="range" min="0" max="1" value="0" step="1" title="Scrub timeline (Arrow Left / Right)">
              <div id="replay-clip-dim-left" aria-hidden="true"></div>
              <div id="replay-clip-dim-right" aria-hidden="true"></div>
              <div id="replay-clip-range" aria-hidden="true"></div>
              <div id="replay-clip-in" role="slider" tabindex="0" aria-label="Clip in point" title="Clip In handle (drag or press I)"></div>
              <div id="replay-clip-out" role="slider" tabindex="0" aria-label="Clip out point" title="Clip Out handle (drag or press O)"></div>
            </div>
          </div>
          <select id="replay-speed" aria-label="Replay speed" title="Playback speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </div>
        <div id="replay-controls-row">
          <div class="replay-bar-group">
            <label id="replay-car-label" for="replay-car">Car</label>
            <select id="replay-car" aria-label="Replay target car" title="Target car ([ / ] or P / N)"></select>
            <label id="replay-camera-label" for="replay-camera">Cam</label>
            <select id="replay-camera" aria-label="Replay camera" title="Camera mode (1–0 or C)"></select>
          </div>
          <div class="replay-bar-group">
            <button type="button" id="replay-clip-mode" aria-pressed="false" title="Clip selection mode: drag timeline to select range (Shift+C) · Set In (I) · Set Out (O) · Clear (X)">✂ Clip</button>
            <button type="button" id="replay-rec-cuts" aria-pressed="false" title="Auto-record cuts when switching camera or car (R)">Rec Cuts</button>
            <button type="button" id="replay-add-cut" title="Add or update camera cut at playhead (K or M)">+ Cut</button>
            <button type="button" id="replay-del-cut" title="Delete camera cut at playhead (Backspace / Delete)">− Cut</button>
            <div id="replay-more-wrap">
              <button type="button" id="replay-more-btn" aria-haspopup="menu" aria-expanded="false" title="More replay actions">⋯</button>
              <div id="replay-more-menu" role="menu" hidden>
                <button type="button" id="replay-director" role="menuitemcheckbox" title="Follow timeline camera cuts (D)">Director Mode</button>
                <button type="button" id="replay-auto-cut" role="menuitem" title="Generate smart multi-camera broadcast cuts">Auto-Cut</button>
                <button type="button" id="replay-clear-cuts" role="menuitem" title="Clear all camera cuts">Clear Cuts</button>
                <button type="button" id="replay-clear-clip" role="menuitem" title="Reset clip range to full replay (X)">Clear Clip Range</button>
                <hr class="replay-menu-sep">
                <button type="button" id="replay-screenshot" role="menuitem" title="Capture PNG screenshot">Screenshot</button>
                <button type="button" id="replay-save" role="menuitem" title="Download replay JSON file">Save JSON</button>
                <button type="button" id="replay-load" role="menuitem" title="Load replay JSON file">Load JSON</button>
              </div>
            </div>
            <input type="file" id="replay-file-input" accept=".json,application/json" hidden>
          </div>
          <div class="replay-bar-group replay-bar-right">
            <button type="button" id="replay-export" class="replay-primary-btn" title="Export selected clip range to video (Esc to cancel)">Export 0:00</button>
            <button type="button" id="replay-close" title="Exit replay">Exit</button>
          </div>
        </div>
      </div>
    </div>
    <div id="mobile-controls">
      <button type="button" id="arrow-handbrake" data-pad="handbrake" aria-label="Handbrake">HAND<br>BRAKE</button>
      <div id="arrow-pad">
        <button type="button" id="arrow-up" data-pad="up" aria-label="Throttle">▲</button>
        <button type="button" id="arrow-left" data-pad="left" aria-label="Steer left">◀</button>
        <button type="button" id="arrow-down" data-pad="down" aria-label="Brake">▼</button>
        <button type="button" id="arrow-right" data-pad="right" aria-label="Steer right">▶</button>
      </div>
    </div>
    <script src="js/curves.js"></script>
    <script src="js/gui.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
      // Make ENABLE3D objects available globally before modules load
      const { Project, Scene3D, PhysicsLoader, THREE } = ENABLE3D;
      window.THREE = THREE;
      window.Scene3D = Scene3D;
      window.Project = Project;
      window.PhysicsLoader = PhysicsLoader;
    </script>

    <script type="module">
      import { MainScene } from './js/mainScene.js';
      import { CarSelectionScene } from './js/carSelectionScene.js';
      import { selectCar, startMainScene } from './js/carSelection.js';

      PhysicsLoader('lib/ammo/kripken', async () => {
        const project = new Project({
          parent: 'car-selection-preview',
          scenes: [CarSelectionScene, MainScene],
          antialias: true,
        })
        const carScene = project.scenes.get('carSelection')
        await carScene.ready
        await selectCar(carScene)
        await startMainScene(project)
      })
    </script>

    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

  </body>
</html>
