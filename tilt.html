<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Tilt test</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #111;
        color: #eee;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
      button {
        font: inherit;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #3d7eff;
        color: #fff;
      }
      button:disabled { opacity: 0.4; }
      #wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin: 24px 0;
      }
      #wheel {
        width: min(48vw, 180px);
        height: min(48vw, 180px);
        color: #eee;
      }
      #steer {
        font-size: 28px;
        font-variant-numeric: tabular-nums;
      }
      pre { margin: 0; white-space: pre-wrap; color: #bbb; }
      .ok { color: #6f6; }
      .wait { color: #fc6; }
      .no { color: #f66; }
    </style>
  </head>
  <body>
    <h1>Tilt test</h1>
    <button id="enable" type="button">Enable sensors</button>
    <div id="wheel-wrap">
      <svg id="wheel" viewBox="0 0 24 24" aria-hidden="true">
        <mask id="tilt-wheel-cut">
          <circle cx="12" cy="12" r="11" fill="#fff"/>
          <circle cx="12" cy="12" r="7.4" fill="#000"/>
          <rect x="3.2" y="10.4" width="17.6" height="3.2" rx="0.6" fill="#fff"/>
          <rect x="10.4" y="12" width="3.2" height="8.8" rx="0.6" fill="#fff"/>
          <circle cx="12" cy="12" r="4.1" fill="#fff"/>
          <circle cx="12" cy="12" r="1.7" fill="#000"/>
          <circle cx="6.1" cy="12" r="1" fill="#000"/>
          <circle cx="17.9" cy="12" r="1" fill="#000"/>
          <circle cx="12" cy="17.9" r="1" fill="#000"/>
        </mask>
        <rect width="24" height="24" fill="currentColor" mask="url(#tilt-wheel-cut)"/>
      </svg>
      <div id="steer">0.00</div>
    </div>
    <pre id="out"></pre>
    <script type="module">
      import {
        gravityFromMotion,
        gravityFromOrientation,
        requestTiltPermission,
        screenRoll,
      } from './js/tilt.js'

      const enable = document.getElementById('enable')
      const wheel = document.getElementById('wheel')
      const steerEl = document.getElementById('steer')
      const out = document.getElementById('out')

      let usedMotion = false
      let last = null
      let status = 'waiting — tap Enable'

      function reqType(EventC) {
        if (typeof EventC === 'undefined') return 'missing'
        if (typeof EventC.requestPermission !== 'function') return 'none'
        return 'function'
      }

      function readout(extra) {
        const r = last
        const lines = [
          'status     ' + status,
          'secure     ' + String(window.isSecureContext),
          'motion.req ' + reqType(window.DeviceMotionEvent),
          'orient.req ' + reqType(window.DeviceOrientationEvent),
          'win.ori    ' + String(window.orientation),
          'scr.angle  ' + String(screen.orientation?.angle),
          'scr.type   ' + String(screen.orientation?.type),
        ]
        if (r) {
          lines.push(
            'source     ' + r.source,
            'steering   ' + r.steering.toFixed(3),
            'roll deg   ' + r.rollDeg.toFixed(1),
            'screen °   ' + r.angleDeg.toFixed(0),
            'gx gy      ' + r.gx.toFixed(2) + '  ' + r.gy.toFixed(2),
            'sx sy      ' + r.sx.toFixed(2) + '  ' + r.sy.toFixed(2),
          )
          if (r.lines) lines.push(r.lines)
        }
        if (extra) lines.push('', extra)
        return lines.join('\n')
      }

      function show(kind, extra) {
        out.className = kind
        out.textContent = readout(extra)
      }

      function apply(gx, gy, extra) {
        const r = screenRoll(gx, gy)
        last = { gx, gy, ...r, ...extra, t: Date.now() }
        status = extra.source
        wheel.style.transform = 'rotate(' + r.rollDeg.toFixed(1) + 'deg)'
        steerEl.textContent = r.steering.toFixed(2)
        show('ok')
      }

      function onMotion(event) {
        const g = gravityFromMotion(event)
        if (!g) return
        usedMotion = true
        apply(g.gx, g.gy, {
          source: 'devicemotion',
          lines: 'acc xyz    ' + [g.gx, g.gy, g.gz].map((n) => n.toFixed(2)).join('  '),
        })
      }

      function onOrientation(event) {
        if (usedMotion) return
        const g = gravityFromOrientation(event)
        apply(g.gx, g.gy, {
          source: 'deviceorientation',
          lines: 'α β γ      ' + [event.alpha, event.beta, event.gamma].map((n) => Number(n).toFixed(1)).join('  '),
        })
      }

      function listen() {
        window.addEventListener('devicemotion', onMotion)
        window.addEventListener('deviceorientation', onOrientation)
        enable.disabled = true
        enable.textContent = 'Listening'
        status = 'listening'
        show('wait')
        setTimeout(() => {
          if (last) return
          status = 'no events'
          show('no', window.isSecureContext
            ? 'if this is a phone, check iOS Settings → Safari → Motion & Orientation Access.'
            : 'LAN http is not a secure context. use https:// via ./run-https.sh, then tap Enable.')
        }, 1500)
      }

      function enableSensors() {
        requestTiltPermission().then((states) => {
          if (!states.length) {
            if (!window.isSecureContext) {
              status = 'not secure'
              show('no', 'no requestPermission API. ./run-https.sh then open the https URL.')
              return
            }
            listen()
            return
          }
          if (states.some((state) => state === 'granted')) listen()
          else {
            enable.disabled = false
            status = 'permission ' + states.join(', ')
            show('no')
          }
        })
      }

      enable.addEventListener('click', enableSensors)
      window.addEventListener('orientationchange', () => {
        if (last) apply(last.gx, last.gy, { source: last.source, lines: last.lines })
        else show(out.className || 'wait')
      })
      if (window.isSecureContext) {
        status = 'waiting — tap Enable'
        show('wait')
      } else {
        status = 'not secure'
        show('no', 'LAN http cannot read sensors. ./run-https.sh and open the https URL, then tap Enable.')
      }
    </script>
  </body>
</html>
